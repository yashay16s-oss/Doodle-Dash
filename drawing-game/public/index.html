<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Board</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎨 Doodle Board</h1>
    <nav>
      <button id="nav-draw" class="nav-btn active">Draw</button>
      <button id="nav-gallery" class="nav-btn">Gallery</button>
      <button id="nav-play" class="nav-btn">Play</button>
    </nav>
  </header>

  <!-- DRAW VIEW -->
  <section id="draw-view" class="view">
    <div class="toolbar">
      <label>Color
        <input type="color" id="color-picker" value="#1a1a1a">
      </label>

      <label>Brush
        <input type="range" id="brush-size" min="1" max="40" value="5">
      </label>

      <button id="eraser-btn">Eraser</button>
      <button id="clear-btn">Clear</button>
    </div>

    <canvas id="canvas" width="800" height="500"></canvas>

    <div class="save-bar">
      <input type="text" id="title-input" placeholder="Give it a title...">
      <input type="text" id="author-input" placeholder="Your name (optional)">
      <button id="save-btn">Save Drawing</button>
    </div>
  </section>

  <!-- GALLERY VIEW -->
  <section id="gallery-view" class="view hidden">
    <div id="gallery-grid" class="gallery-grid">
      <p class="empty-msg">No drawings yet — go make one!</p>
    </div>
  </section>
<!-- PLAY VIEW -->
  <section id="play-view" class="view hidden">

    <!-- Lobby screen -->
    <div id="lobby-screen">
      <div class="lobby-box">
        <h2>Play with friends</h2>
        <input type="text" id="player-name" placeholder="Your name" maxlength="16">

        <div class="lobby-actions">
          <button id="create-room-btn">Create Room</button>
          <div class="lobby-divider">or</div>
          <div class="join-row">
            <input type="text" id="room-code-input" placeholder="ROOM CODE" maxlength="4">
            <button id="join-room-btn">Join</button>
          </div>
        </div>
        <p id="lobby-error" class="lobby-error hidden"></p>
      </div>
    </div>

    <!-- Game room screen -->
    <div id="game-screen" class="hidden">
      <div class="game-top">
        <div class="room-code-display">Room: <span id="room-code-display"></span></div>
        <div id="round-status">Waiting for players...</div>
        <div id="timer-display"></div>
      </div>

      <div class="game-layout">
        <div class="game-canvas-col">
          <div id="word-banner" class="word-banner hidden"></div>

          <div class="toolbar" id="game-toolbar">
            <label>Color
              <input type="color" id="game-color-picker" value="#1a1a1a">
            </label>
            <label>Brush
              <input type="range" id="game-brush-size" min="1" max="40" value="5">
            </label>
            <button id="game-eraser-btn">Eraser</button>
            <button id="game-clear-btn">Clear</button>
          </div>

          <canvas id="game-canvas" width="700" height="450"></canvas>

          <button id="start-game-btn" class="hidden">Start Game</button>
        </div>

        <div class="game-side-col">
          <div class="player-panel">
            <h4>Players</h4>
            <ul id="player-list"></ul>
          </div>

          <div class="chat-panel">
            <div id="chat-log"></div>
            <form id="guess-form">
              <input type="text" id="guess-input" placeholder="Type your guess..." autocomplete="off">
              <button type="submit">Send</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-content">
      <button id="lightbox-close">&times;</button>
      <img id="lightbox-img" src="" alt="Drawing">
      <div class="lightbox-info">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-meta"></p>
        <button id="lightbox-delete">Delete</button>
      </div>
    </div>
  </div>

  
  <script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script src="game.js"></script>
</body>
</html>
